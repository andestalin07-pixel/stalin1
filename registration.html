<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            background: green;
            
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Event Registration</h2>

    <form>
        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone" required>

        <label>College:</label>
        <input type="text" name="college" required>

        <label>Event:</label>
        <select name="event">
            <option>Technical Fest</option>
            <option>Hackathon</option>
            <option>Workshop</option>
            <option>Cultural Event</option>
        </select>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
